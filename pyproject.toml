[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-showcase-studio"
version = "0.0.1"
description = "Hybrid multi-agent system that turns a codebase into docs, a tutorial and a narrated demo video."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Achyut Yesare" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Achyut0617/showcase-studio"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
showcase = "showcase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
